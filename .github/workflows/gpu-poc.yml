name: GPU POC Check

# CI for the standalone Vulkan/df64 proofs of concept in poc/gpu (branch vulkan-gpu). Nothing under src/ is
# involved, so this workflow ignores everything outside poc/gpu.
#
# What the jobs can and cannot show (read before trusting a green check):
#   * linux-lavapipe: builds the POCs and runs their correctness checks on lavapipe, Mesa's CPU
#     implementation of Vulkan. There is NO GPU on a GitHub-hosted runner, so this checks the host code and
#     the SPIR-V kernels' logic against a second Vulkan implementation (the POCs were developed on
#     MoltenVK/Metal), not GPU behaviour or speed. No timing is run: a CPU driver says nothing about it.
#   * nvidia-t4: runs on the organization's hosted GPU runner (label gpu-t4, an NVIDIA Tesla T4, discrete GPU
#     over PCIe). This is the only job whose timings say anything about a discrete GPU. It is BILLED per minute and
#     the runner pool has size 1, so it runs only when the free lavapipe job passed, only for the path-filtered
#     changes above, and a newer push cancels a run in progress. It fails if Vulkan does not pick the NVIDIA device.
#   * apple-gpu: runs on a self-hosted Apple Silicon runner, manual dispatch only. It goes through the
#     machine's shared-GPU lock wrapper (poc/gpu/tools/with_gpu_lock.sh) like every other GPU run here.
#
# Gating vs informational: the integer-only POCs (poc3_select radix select, poc7_sort radix sort) and the
# CPU-only failure-handling POC (poc4_fallback) must pass. The df64 float POCs (poc0, poc1, poc2) are
# informational on lavapipe (continue-on-error) because df64 depends on the driver's float semantics, which is
# exactly what a different driver may legitimately change; read their output instead of the check mark.
#
# Not yet run: written without a CI run (no Linux runner on the development machine). The first run will
# likely need adjustments. The arm64 runner label (ubuntu-24.04-arm) needs a public repository or an arm64
# runner of your own; that matrix entry is allowed to fail.

on:
  push:
    branches: [vulkan-gpu]
    paths:
      - 'poc/gpu/**'
      - '.github/workflows/gpu-poc.yml'
      # Docs and local-only helpers do not affect the build or the checks.
      - '!poc/gpu/**.md'
      - '!poc/gpu/.gitignore'
      - '!poc/gpu/run_gpu_pocs.sh'
      - '!poc/gpu/run_matrix.sh'
      - '!poc/gpu/tools/with_gpu_lock.sh'
      - '!poc/gpu/tools/t4_ci_turn.sh'
  pull_request:
    paths:
      - 'poc/gpu/**'
      - '.github/workflows/gpu-poc.yml'
      # Same filter as the push trigger.
      - '!poc/gpu/**.md'
      - '!poc/gpu/.gitignore'
      - '!poc/gpu/run_gpu_pocs.sh'
      - '!poc/gpu/run_matrix.sh'
      - '!poc/gpu/tools/with_gpu_lock.sh'
      - '!poc/gpu/tools/t4_ci_turn.sh'
  workflow_dispatch:
    inputs:
      nvidia_gpu:
        description: "Also run the billed NVIDIA T4 job (gpu-t4 hosted runner)"
        type: boolean
        default: true
      apple_gpu:
        description: "Also run the checks on the self-hosted Apple Silicon runner (uses the real GPU)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same ref replaces the run in progress. A manual run is its own group.
concurrency:
  group: gpu-poc-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-manual-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Same versions as the local Vulkan SDK the POCs were developed against.
  VULKAN_HEADERS_TAG: v1.3.283
  VOLK_TAG: vulkan-sdk-1.3.283.0
  # Slang is used only for the GLSL-vs-Slang comparison (poc/gpu/slang). Same release the pg-strom fork pins; the sha256
  # values are the digests GitHub reports for the release assets.
  SLANG_VERSION: "2026.20"
  SLANG_SHA256_X86_64: e863e568c204810d6e8bc31852f056aef6763c55ea9925db2db7affa060347c9
  SLANG_SHA256_AARCH64: b0345743e2153d8c2bd33f56fb5696bcef63fc03513f054a1ae1b8d3dd0152a9

jobs:
  linux-lavapipe:
    name: Linux ${{ matrix.arch }}, lavapipe (CPU Vulkan, no GPU)
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    timeout-minutes: 60
    env:
      GPU_POC_CORRECTNESS_ONLY: "1"   # no timing sweeps on a CPU driver
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      # The repository is huge; the POCs need only their own directory.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            poc/gpu
            src/third_party/boost
          fetch-depth: 1

      - name: Install packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ glslc spirv-tools libvulkan1 mesa-vulkan-drivers vulkan-tools python3-numpy

      - name: Fetch Vulkan headers and volk (pinned tags)
        run: |
          git clone --depth 1 --branch "$VULKAN_HEADERS_TAG" https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
          git clone --depth 1 --branch "$VOLK_TAG" https://github.com/zeux/volk "$RUNNER_TEMP/volk"

      # 3D mesh workstream (poc/gpu/mesh/PLAN.md): pinned third-party file, checked against oracle/SHA256SUMS; the vendored Boost headers come from the sparse checkout.
      - name: Mesh, fetch the pinned Shewchuk predicates
        working-directory: poc/gpu
        run: mesh/oracle/fetch.sh

      - name: Build
        working-directory: poc/gpu
        env:
          SPIRV_TOOLS_BIN: /usr/bin
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVKSDK="$RUNNER_TEMP/vkh" -DVOLK_DIR="$RUNNER_TEMP/volk"
          cmake --build build -j "$(nproc)"
          mkdir -p out

      # Informational until seen passing on both architectures. CPU-only: no GPU involved.
      - name: Mesh, MP02 predicate oracles and planted mutants
        working-directory: poc/gpu
        timeout-minutes: 10
        continue-on-error: true
        run: build/mesh/predicates_check 2000000

      - name: Mesh, MP01 corpus is byte-reproducible and matches the recorded hashes (x86_64 and aarch64 must agree)
        working-directory: poc/gpu
        timeout-minutes: 10
        continue-on-error: true
        run: |
          mesh/corpus/gen_corpus.sh --check
          mesh/corpus/gen_corpus.sh --selftest

      - name: Mesh, MP09 orient3d filter in exact soft binary64 (host)
        working-directory: poc/gpu
        timeout-minutes: 15
        continue-on-error: true
        run: build/mesh/mp09_orient_filter host 800000

      - name: Select the lavapipe driver and show the device (informational)
        run: |
          ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | head -40

      - name: Mesh, MP09 orient3d filter on the lavapipe device (informational; after the driver is selected)
        working-directory: poc/gpu
        timeout-minutes: 15
        continue-on-error: true
        run: ./run.sh mesh/mp09_orient_filter device 400000

      - name: Mesh, MP10 LBVH and pair emission on the lavapipe device (informational)
        working-directory: poc/gpu
        timeout-minutes: 20
        continue-on-error: true
        run: ./run.sh mesh/mp10_lbvh device 0.1

      - name: POC 4, failure handling (no GPU)
        working-directory: poc/gpu
        run: ./build/poc4_fallback

      - name: POC 3, radix select correctness
        working-directory: poc/gpu
        timeout-minutes: 20
        run: ./run.sh poc3_select

      - name: POC 7, radix sort correctness
        working-directory: poc/gpu
        timeout-minutes: 20
        run: ./run.sh poc7_sort

      # Gating: every group's GPU sum must match the CPU. This caught a wrong grouped kernel on Metal (M1) that the
      # one-group accuracy test could not see.
      - name: POC 2, grouped $sum correctness
        working-directory: poc/gpu
        timeout-minutes: 10
        run: ./run.sh poc2_sum groups

      - name: POC 12, integer binary64 add (host check, no GPU)
        working-directory: poc/gpu
        timeout-minutes: 10
        run: ./run.sh poc12_f64soft host

      # Informational until seen passing on every driver: 64-bit integer arithmetic on the device.
      - name: POC 12, integer binary64 $sum on the device (informational)
        working-directory: poc/gpu
        timeout-minutes: 10
        continue-on-error: true
        run: |
          ./run.sh poc12_f64soft device
          POC2_SOFT=1 ./run.sh poc2_sum groups
          POC2_SOFT=1 ./run.sh poc2_sum accuracy

      - name: POC 0, loader and probe (informational)
        working-directory: poc/gpu
        continue-on-error: true
        run: ./run.sh poc0_probe || { echo "::warning title=POC 0 on lavapipe::probe failed, see the step log"; exit 1; }

      - name: POC 1, df64 correctness (informational)
        working-directory: poc/gpu
        continue-on-error: true
        timeout-minutes: 15
        run: |
          ./run.sh poc1_df64 build/shaders precise
          # continue-on-error shows a green mark even when this fails, so say so in the run summary.
          python3 verify_df64.py precise || { echo "::warning title=POC 1 df64 on lavapipe::df64 verification FAILED, see the step log"; exit 1; }

      # Tests the hypothesis that lavapipe's fma is not fused (POC 1 mul/div/sqrt fail there): if so the fma probe
      # fails for the first variant and the Dekker (no-fma) variant passes.
      - name: POC 8, df64 self-test (informational)
        working-directory: poc/gpu
        continue-on-error: true
        run: |
          ./run.sh poc8_selftest auto || echo "::warning title=POC 8 df64 self-test on lavapipe::no df64 variant passed, see the step log"

      # Informational: does the Slang-compiled df64 stay exact on this driver? (RESULTS.md, "Slang vs GLSL")
      - name: POC 8, df64 self-test with Slang kernels (informational)
        working-directory: poc/gpu
        continue-on-error: true
        run: |
          ARCH=${{ matrix.arch }}
          D="$HOME/tools/slang-${SLANG_VERSION}"; mkdir -p "$D"
          if [ "$ARCH" = aarch64 ]; then SHA="$SLANG_SHA256_AARCH64"; else SHA="$SLANG_SHA256_X86_64"; fi
          curl -fsSL -o /tmp/slang.tar.gz "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-${ARCH}.tar.gz"
          echo "$SHA  /tmp/slang.tar.gz" | sha256sum -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          "$SLANGC" -v
          slang/build_df64.sh "$SLANGC"
          export GPU_POC_DF64_DIR=build/slang
          ./run.sh poc8_selftest auto || echo "::warning title=POC 8 Slang df64 self-test on lavapipe::no Slang df64 variant passed, see the step log"
          ./run.sh poc8_selftest nofma || echo "::warning title=POC 8 Slang df64 self-test (no-fma) on lavapipe::FAILED, see the step log"

      - name: POC 1, df64 correctness without fma (informational)
        working-directory: poc/gpu
        continue-on-error: true
        timeout-minutes: 15
        run: |
          ./run.sh poc1_df64 build/shaders nofma
          python3 verify_df64.py nofma || { echo "::warning title=POC 1 df64 (no-fma variant) on lavapipe::verification FAILED, see the step log"; exit 1; }

      - name: POC 2, `$sum` accuracy (informational)
        working-directory: poc/gpu
        continue-on-error: true
        timeout-minutes: 15
        run: ./run.sh poc2_sum accuracy

  # MP21a (poc/gpu/mesh/PLAN.md): does the MP20 Geogram patch behave the same on Linux x86_64 and aarch64? Informational only: it is
  # continue-on-error, nothing needs it, and it never runs on the T4 job. It is a separate job (not steps of linux-lavapipe) because it
  # needs no Vulkan and a Geogram build takes minutes; as its own job it runs in parallel and cannot delay the T4 job.
  mesh-geogram-xplat:
    name: Mesh MP21a, patched Geogram ${{ matrix.arch }} (informational)
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 40
    env:
      WORK: /home/runner/mp21_work
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            poc/gpu
            src/third_party/boost
          fetch-depth: 1

      - name: Install packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build make patch curl python3

      - name: Fetch the pinned Shewchuk predicates (scoring oracle)
        run: poc/gpu/mesh/oracle/fetch.sh

      - name: Fetch Geogram v1.10.1 and verify the pinned tarball sha256
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh fetch

      - name: Build Geogram, unpatched (permissive flags, static)
        timeout-minutes: 15
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh build-unpatched

      - name: Build Geogram with geogram_mp20.patch (permissive flags, static)
        timeout-minutes: 15
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh build-patched

      - name: Build the scoring oracle and the corpus generators
        timeout-minutes: 10
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh tools

      - name: Generate touch_* and set 4, verify against the recorded EXPECTED_SHA256 files
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh corpus

      - name: Score unpatched and patched (touch_* 240 rows, first 600 rows of set 4)
        timeout-minutes: 15
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh score

      - name: Verdict tables and patched output hashes
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh report

      - name: Upload TSVs, hashes and patched outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp21a-geogram-${{ matrix.arch }}
          path: |
            ${{ env.WORK }}/report/
            ${{ env.WORK }}/score/*.tsv
            ${{ env.WORK }}/score/log_*.log
            ${{ env.WORK }}/score/patched_*_*/*.msh
            ${{ env.WORK }}/*.log
            ${{ env.WORK }}/geo_*/build.log
          if-no-files-found: warn
          retention-days: 30

  # MP23 (poc/gpu/mesh/PLAN.md 'Exactness contract (tiers)', MP03): tier-3 measurement for Manifold v3.5.5. Informational (continue-on-error), never
  # gating, no GPU. Builds the SERIAL variant with -ffp-contract=off (the M1 'A' build; Clipper2 is fetched by Manifold's CMake and its commit is
  # checked against the pin), regenerates the G1 corpus (hard failure if any file differs from corpus/EXPECTED_SHA256.txt), scores it with
  # oracle/score_library.py as the M1 run did, runs every pair twice, and prints per-class tables, the verdict diff against
  # lib/manifold/scoring_results.tsv, the aggregate sha256 of the outputs and a "TIER 3 vs M1" line. Compare the aggregate hash of the x86_64 and
  # aarch64 artifacts (report/aggregate_sha256.txt) for tier 3 between the two. Expected runtime: a few minutes (the M1 does everything in ~25 s).
  mesh-manifold-xplat:
    name: Mesh MP23, Manifold tier 3 ${{ matrix.arch }} (informational)
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 40
    env:
      WORK: /home/runner/mp23_work
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            poc/gpu
            src/third_party/boost
          fetch-depth: 1

      - name: Install packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build make git curl ca-certificates python3

      - name: Fetch the pinned Shewchuk predicates (scoring oracle)
        run: poc/gpu/mesh/oracle/fetch.sh

      - name: Fetch Manifold v3.5.5 and verify the pinned commit
        run: poc/gpu/mesh/ci/mp23_manifold_xplat.sh fetch

      - name: Build the scoring oracle and the corpus generator
        timeout-minutes: 10
        run: poc/gpu/mesh/ci/mp23_manifold_xplat.sh tools

      - name: Generate the G1 corpus, verify against EXPECTED_SHA256.txt
        run: poc/gpu/mesh/ci/mp23_manifold_xplat.sh corpus

      - name: Build Manifold (serial, -ffp-contract=off) and manifold_runner
        timeout-minutes: 20
        run: poc/gpu/mesh/ci/mp23_manifold_xplat.sh build

      - name: Score the G1 corpus (93 rows)
        timeout-minutes: 10
        run: poc/gpu/mesh/ci/mp23_manifold_xplat.sh score

      - name: Run every pair a second time
        run: poc/gpu/mesh/ci/mp23_manifold_xplat.sh rerun

      - name: Tables, verdict diff, aggregate hash, tier-3 line
        run: poc/gpu/mesh/ci/mp23_manifold_xplat.sh report

      - name: Upload report, TSVs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp23-manifold-${{ matrix.arch }}
          path: |
            ${{ env.WORK }}/report/
            ${{ env.WORK }}/score/run1/results.tsv
            ${{ env.WORK }}/score/run2.tsv
            ${{ env.WORK }}/score/run1/*.msh
            ${{ env.WORK }}/*.log
          if-no-files-found: warn
          retention-days: 30

  # MP22b (poc/gpu/mesh/PLAN.md section MP22 / MP22b): acceptance run of the MP22 Geogram patch on set 5 (fresh seeds, 1100 pairs, 3300 rows per
  # build; generator and file hashes recorded before any run). Same matrix and same script as the MP21a job, as its own job so the two cannot delay
  # each other (the M1 needs about 1 minute per build for the scoring; one Geogram build + two incremental rebuilds + three scorings should be
  # well inside 25 minutes here). Builds unpatched, MP20 (patch hash checked against mp20/FROZEN_SHA256.txt) and MP20 then MP22 (hash checked
  # against mp22/FROZEN_SHA256.txt), scores all three on set 5, prints per-class verdict tables, the bar line
  # "MP22b: 0 FAIL and 0 REFUSED on this platform: MET/NOT MET" and the sha256 of the MP22 outputs. Informational (continue-on-error) like MP21a:
  # read the bar line, not the check mark. Hard failures (exit 1): a hash differs from a recorded one, a build fails, set 5 does not regenerate
  # bit-identically on this platform.
  mesh-mp22b-geogram:
    name: Mesh MP22b, set 5 with MP22-patched Geogram ${{ matrix.arch }} (informational)
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 40
    env:
      WORK: /home/runner/mp22b_work
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            poc/gpu
            src/third_party/boost
          fetch-depth: 1

      - name: Install packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build make patch curl python3

      - name: Fetch the pinned Shewchuk predicates (scoring oracle)
        run: poc/gpu/mesh/oracle/fetch.sh

      - name: Fetch Geogram v1.10.1 and verify the pinned tarball sha256
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh fetch

      - name: Build Geogram unpatched, then with the MP20 patch, then with the MP22 patch (frozen hashes checked)
        timeout-minutes: 20
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh build-chain

      - name: Build the scoring oracle and the corpus generators
        timeout-minutes: 10
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh tools

      - name: Generate set 5, verify the generator and every file against the hashes recorded before the run
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh corpus5

      - name: Score unpatched, MP20 and MP22 on set 5 (3300 rows each)
        timeout-minutes: 25
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh score5

      - name: Verdict tables, bar line and MP22 output hashes
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh report5

      - name: Upload TSVs, hashes and MP22 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp22b-geogram-${{ matrix.arch }}
          path: |
            ${{ env.WORK }}/report5/
            ${{ env.WORK }}/score/*.tsv
            ${{ env.WORK }}/score/log_*.log
            ${{ env.WORK }}/score/mp22_set5_*/*.msh
            ${{ env.WORK }}/*.log
            ${{ env.WORK }}/geo_chain/build*.log
          if-no-files-found: warn
          retention-days: 30

  # MP24 (poc/gpu/mesh/PLAN.md section MP24): the assembled high-fidelity boolean pipeline geogram_fidelity (exact validation, exact re-centring, Geogram with the MP20 and
  # MP22 patches, translate back) built on top of the MP22b chain and scored on the G1 corpus (93 rows), the MP24 offset and thin families, touch set 3 and set 5. Same matrix
  # as MP22b. The pipeline sources are frozen (lib/geogram/mp24/FROZEN_SHA256.txt, checked before the build); every generator output (G1, set 3, set 5, offset, thin) is verified
  # against its recorded sha256 list before anything is scored. Prints per-family tables, the translate-back error, refusals by reason, the per-bar lines and
  # "MP24: bars 1-5 on this platform: MET/NOT MET", and the aggregate sha256 of all outputs and of the verdict list (bar 6: compare the two Linux artifacts afterwards).
  # Informational (continue-on-error): read the bar line, not the check mark.
  mesh-mp24-geogram:
    name: Mesh MP24, geogram_fidelity pipeline ${{ matrix.arch }} (informational)
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 60
    env:
      WORK: /home/runner/mp24_work
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            poc/gpu
            src/third_party/boost
          fetch-depth: 1

      - name: Install packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build make patch curl python3 zlib1g-dev

      - name: Fetch the pinned Shewchuk predicates (scoring oracle)
        run: poc/gpu/mesh/oracle/fetch.sh

      - name: Fetch Geogram v1.10.1 and verify the pinned tarball sha256
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh fetch

      - name: Build Geogram (unpatched, MP20, MP22; frozen patch hashes checked), the MP22 state is what geogram_fidelity links
        timeout-minutes: 20
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh build-chain

      - name: Build geogram_fidelity (sources checked against mp24/FROZEN_SHA256.txt)
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh build-fidelity

      - name: Build the scoring oracle and the corpus generators
        timeout-minutes: 10
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh tools24

      - name: Generate G1, set 3, set 5 and the MP24 families, verify every file against the recorded hashes
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh corpus24

      - name: Score geogram_fidelity on G1, offset, thin, set 3 and set 5 (GEOGRAM_RUNNER_THREADS=1)
        timeout-minutes: 30
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh score24

      - name: Verdict tables, per-bar lines, MP24 bar line and output hashes
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh report24

      - name: Upload TSVs, hashes and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp24-geogram-${{ matrix.arch }}
          path: |
            ${{ env.WORK }}/report24/
            ${{ env.WORK }}/score24/*.tsv
            ${{ env.WORK }}/score24/log_*.log
            ${{ env.WORK }}/*.log
          if-no-files-found: warn
          retention-days: 30

  # MP24b: pipeline v2 (exact scale + re-centre or c = 0 or hard-limit refusal), same matrix as MP24. Frozen sources: lib/geogram/mp24b/FROZEN_SHA256.txt (checked before the build); the fresh
  # families (corpus/fidelity2) are regenerated and every file is checked against corpus/fidelity2/EXPECTED_SHA256.txt (recorded before any run); the MP24 families are re-run through v2.
  # Each family is scored once per platform. Informational (never gating): the bar line is 'MP24b: 0 FAIL and only hard-limit refusals: MET/NOT MET'.
  mesh-mp24b-geogram:
    name: Mesh MP24b, geogram_fidelity2 pipeline v2 ${{ matrix.arch }} (informational)
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 60
    env:
      WORK: /home/runner/mp24b_work
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            poc/gpu
            src/third_party/boost
          fetch-depth: 1

      - name: Install packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build make patch curl python3 zlib1g-dev

      - name: Fetch the pinned Shewchuk predicates (scoring oracle)
        run: poc/gpu/mesh/oracle/fetch.sh

      - name: Fetch Geogram v1.10.1 and verify the pinned tarball sha256
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh fetch

      - name: Build Geogram (unpatched, MP20, MP22; frozen patch hashes checked), the MP22 state is what geogram_fidelity2 links
        timeout-minutes: 20
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh build-chain

      - name: Build geogram_fidelity2 (sources checked against mp24b/FROZEN_SHA256.txt)
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh build-fidelity2

      - name: Build the scoring oracle and the corpus generators (including gen_fidelity2)
        timeout-minutes: 10
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh tools24b

      - name: Generate G1, set 3, set 5, the MP24 families and the MP24b families, verify every file against the recorded hashes
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh corpus24b

      - name: Score geogram_fidelity2 on G1, offset, thin, set 3, set 5 and the MP24b families (GEOGRAM_RUNNER_THREADS=1, each family once)
        timeout-minutes: 30
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh score24b

      - name: Verdict tables, refusals by reason, MP24b bar line and output hashes
        run: poc/gpu/mesh/ci/mp21_geogram_xplat.sh report24b

      - name: Upload TSVs, hashes and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp24b-geogram-${{ matrix.arch }}
          path: |
            ${{ env.WORK }}/report24b/
            ${{ env.WORK }}/score24b/*.tsv
            ${{ env.WORK }}/score24b/log_*.log
            ${{ env.WORK }}/*.log
          if-no-files-found: warn
          retention-days: 30

  nvidia-t4:
    name: NVIDIA Tesla T4 (hosted GPU runner, billed)
    needs: linux-lavapipe
    # Billed: a commit message containing [skip gpu] runs only the free lavapipe job.
    if: (github.event_name != 'workflow_dispatch' || inputs.nvidia_gpu) && !contains(github.event.head_commit.message, '[skip gpu]')
    runs-on: gpu-t4
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            poc/gpu
            src/third_party/boost
          fetch-depth: 1

      - name: Install packages
        timeout-minutes: 10
        run: |
          cat /etc/os-release | head -3
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ glslc spirv-tools libvulkan1 vulkan-tools python3-numpy
          command -v glslc

      - name: Select the NVIDIA Vulkan driver and show the device
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true
          ICD="$(ls /usr/share/vulkan/icd.d/nvidia_icd.json /etc/vulkan/icd.d/nvidia_icd.json 2>/dev/null | head -1)"
          test -n "$ICD" || { echo "::error::no nvidia_icd.json on this image"; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | grep -E 'deviceName|deviceType|driverName|driverInfo|apiVersion' | head
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | grep -q 'NVIDIA' || { echo "::error::Vulkan does not see the NVIDIA GPU"; exit 1; }

      - name: Fetch Vulkan headers and volk (pinned tags)
        run: |
          git clone --depth 1 --branch "$VULKAN_HEADERS_TAG" https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
          git clone --depth 1 --branch "$VOLK_TAG" https://github.com/zeux/volk "$RUNNER_TEMP/volk"

      - name: Mesh, fetch the pinned Shewchuk predicates
        working-directory: poc/gpu
        run: mesh/oracle/fetch.sh

      - name: Build
        working-directory: poc/gpu
        env:
          SPIRV_TOOLS_BIN: /usr/bin
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVKSDK="$RUNNER_TEMP/vkh" -DVOLK_DIR="$RUNNER_TEMP/volk"
          cmake --build build -j "$(nproc)"
          mkdir -p out

      - name: POC 4, failure handling (no GPU)
        working-directory: poc/gpu
        run: ./build/poc4_fallback

      # GPU clocks, temperature, power and throttle reasons once a second, to see whether run-to-run timing variation
      # is throttling. Summarized in the last step.
      - name: Start GPU telemetry
        run: |
          nohup nvidia-smi --query-gpu=timestamp,clocks.sm,clocks.max.sm,temperature.gpu,power.draw,clocks_throttle_reasons.active --format=csv,noheader,nounits -l 1 > "$RUNNER_TEMP/smi.csv" 2>&1 &
          echo $! > "$RUNNER_TEMP/smi.pid"

      # The df64 self-test is informational: a failure is a finding to read, not a reason to skip the benchmarks.
      - name: POC 8, df64 self-test (informational)
        working-directory: poc/gpu
        continue-on-error: true
        run: |
          ./run.sh poc8_selftest auto || echo "::warning title=POC 8 df64 self-test on NVIDIA::no df64 variant passed, see the step log"
          ./run.sh poc8_selftest nofma || echo "::warning title=POC 8 df64 self-test (no-fma variant) on NVIDIA::FAILED, see the step log"

      # Informational: does the Slang-compiled df64 stay exact on this driver? (RESULTS.md, "Slang vs GLSL")
      - name: POC 8, df64 self-test with Slang kernels (informational)
        working-directory: poc/gpu
        continue-on-error: true
        run: |
          ARCH=x86_64
          D="$HOME/tools/slang-${SLANG_VERSION}"; mkdir -p "$D"
          if [ "$ARCH" = aarch64 ]; then SHA="$SLANG_SHA256_AARCH64"; else SHA="$SLANG_SHA256_X86_64"; fi
          curl -fsSL -o /tmp/slang.tar.gz "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-${ARCH}.tar.gz"
          echo "$SHA  /tmp/slang.tar.gz" | sha256sum -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          "$SLANGC" -v
          slang/build_df64.sh "$SLANGC"
          export GPU_POC_DF64_DIR=build/slang
          ./run.sh poc8_selftest auto || echo "::warning title=POC 8 Slang df64 self-test on NVIDIA::no Slang df64 variant passed, see the step log"
          ./run.sh poc8_selftest nofma || echo "::warning title=POC 8 Slang df64 self-test (no-fma) on NVIDIA::FAILED, see the step log"

      - name: POC 1, df64 correctness (informational)
        working-directory: poc/gpu
        continue-on-error: true
        run: |
          ./run.sh poc1_df64 build/shaders precise
          python3 verify_df64.py precise || { echo "::warning title=POC 1 df64 on NVIDIA::verification FAILED, see the step log"; exit 1; }

      - name: "POC 3, radix select - correctness and timing"
        working-directory: poc/gpu
        timeout-minutes: 10
        run: ./run.sh poc3_select

      # Diagnostics for the T4 scaling problems recorded in RESULTS.md (radix select past 1M, radix sort cost per pass).
      - name: "Diagnostics - radix select sweep and radix sort kernel profile"
        working-directory: poc/gpu
        continue-on-error: true
        timeout-minutes: 15
        run: |
          ./run.sh poc3_select sweep
          ./run.sh poc7_sort profile

      - name: "POC 7, radix sort - correctness and timing"
        working-directory: poc/gpu
        timeout-minutes: 10
        run: ./run.sh poc7_sort

      - name: "POC 9, $stdDev accuracy and timing"
        working-directory: poc/gpu
        continue-on-error: true
        timeout-minutes: 15
        run: ./run.sh poc9_stddev

      - name: "POC 11, pre-warming and idle-clock keep-alive"
        working-directory: poc/gpu
        continue-on-error: true
        timeout-minutes: 10
        run: ./run.sh poc11_prewarm

      # An operator-level alternative to a software heartbeat: lock the GPU clocks so an idle GPU does not drop them.
      # Needs root and a GPU that allows it; informational. The clocks are reset afterwards.
      - name: "POC 11, with locked GPU clocks (nvidia-smi -lgc)"
        working-directory: poc/gpu
        continue-on-error: true
        timeout-minutes: 10
        run: |
          nvidia-smi --query-supported-clocks=gr --format=csv,noheader | head -3
          sudo nvidia-smi -lgc 1590,1590 || { echo "::warning title=locking the GPU clocks::not permitted on this runner"; exit 1; }
          POC11_IDLE_ONLY=1 ./run.sh poc11_prewarm
      - name: Reset the GPU clocks
        if: always()
        continue-on-error: true
        run: sudo nvidia-smi -rgc || true

      - name: "POC 2, grouped $sum correctness"
        working-directory: poc/gpu
        timeout-minutes: 10
        run: ./run.sh poc2_sum groups

      - name: "POC 12, integer binary64 add and $sum (informational)"
        working-directory: poc/gpu
        timeout-minutes: 15
        continue-on-error: true
        run: |
          ./run.sh poc12_f64soft host
          ./run.sh poc12_f64soft device
          POC2_SOFT=1 ./run.sh poc2_sum groups
          POC2_SOFT=1 ./run.sh poc2_sum accuracy
          POC2_SOFT=1 ./run.sh poc2_sum bench 1
          POC2_SOFT=1 ./run.sh poc2_sum bench 16

      - name: "Mesh, MP10 LBVH and pair emission on the GPU (informational)"
        working-directory: poc/gpu
        timeout-minutes: 25
        continue-on-error: true
        run: ./run.sh mesh/mp10_lbvh device 1.0

      - name: "Mesh, MP09 orient3d filter on the GPU (informational)"
        working-directory: poc/gpu
        timeout-minutes: 15
        continue-on-error: true
        run: |
          build/mesh/mp09_orient_filter host 800000
          ./run.sh mesh/mp09_orient_filter device 2000000

      - name: "POC 2, $sum timing (G=1 and G=16) and accuracy"
        working-directory: poc/gpu
        continue-on-error: true
        timeout-minutes: 15
        run: |
          ./run.sh poc2_sum bench 1
          ./run.sh poc2_sum bench 16
          ./run.sh poc2_sum accuracy

      - name: GPU telemetry summary
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/smi.pid")" 2>/dev/null || true
          echo "samples: $(wc -l < "$RUNNER_TEMP/smi.csv")"
          echo "sm clock MHz (min / max seen, and the maximum the GPU allows):"
          awk -F', ' 'NF>=6 {c=$2+0; if(min==""||c<min)min=c; if(c>max)max=c; m=$3} END {print min " / " max "  (max " m ")"}' "$RUNNER_TEMP/smi.csv"
          echo "temperature C max / power W max:"
          awk -F', ' 'NF>=6 {if($4+0>t)t=$4+0; if($5+0>p)p=$5+0} END {print t " / " p}' "$RUNNER_TEMP/smi.csv"
          echo "throttle reason masks seen (hex, count):"
          awk -F', ' 'NF>=6 {print $6}' "$RUNNER_TEMP/smi.csv" | sort | uniq -c | sort -rn | head
          echo "--- every 5th sample ---"
          awk 'NR%5==1' "$RUNNER_TEMP/smi.csv" | head -40

  apple-gpu:
    name: Apple Silicon GPU checks (self-hosted runner, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.apple_gpu
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: poc/gpu
          fetch-depth: 1

      # Uses the Vulkan SDK at ~/VulkanSDK/1.3.283.0/macOS, the CMake default.
      - name: Build
        working-directory: poc/gpu
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          mkdir -p out

      # One short session on the shared GPU (the same protocol as pg-strom's test lock).
      - name: Correctness checks on the real GPU
        working-directory: poc/gpu
        run: |
          tools/with_gpu_lock.sh sh -c './run.sh poc3_select && ./run.sh poc7_sort && ./run.sh poc2_sum accuracy'
